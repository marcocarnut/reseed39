<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bip39rxcrack — keyspace / effort estimator</title>
<link rel="icon" href="data:,">
<style>
  :root{
    --bg:#0f1420; --panel:#171e2e; --panel2:#1e2740; --edge:#2b3654;
    --ink:#e6ecfb; --dim:#93a0bf; --accent:#5b9dff; --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
    --green:#2ec16b; --yellow:#e6b800; --red:#ef5350;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{padding:12px 18px;border-bottom:1px solid var(--edge);display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  header h1{font-size:17px;margin:0;font-weight:650}
  header .motto{color:var(--dim);font-style:italic;font-size:12.5px}
  header .warn{margin-left:auto;color:var(--yellow);font-size:12px;max-width:340px;text-align:right}
  .langSeg{display:inline-flex;border:1px solid var(--edge);border-radius:6px;overflow:hidden;margin-left:10px}
  .langSeg button{background:#0c1120;color:var(--dim);border:0;padding:3px 9px;cursor:pointer;font-size:11.5px}
  .langSeg button.on{background:var(--accent);color:#04102a;font-weight:600}
  .tabs{display:flex;gap:2px;padding:0 18px;border-bottom:1px solid var(--edge);background:var(--panel)}
  .tab{padding:9px 16px;cursor:pointer;color:var(--dim);border-bottom:2px solid transparent;user-select:none}
  .tab.active{color:var(--ink);border-bottom-color:var(--accent)}
  .view{display:none}
  .view.active{display:block}
  .cols{display:grid;grid-template-columns:230px minmax(340px,1fr) minmax(320px,1.1fr);gap:0;min-height:calc(100vh - 96px)}
  .pane{padding:16px 18px;overflow:auto}
  .pane.presets{border-right:1px solid var(--edge);background:var(--panel)}
  .pane.form{border-right:1px solid var(--edge)}
  .pane.results{background:var(--panel)}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:0 0 10px}
  .preset{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--edge);color:var(--ink);
          border-radius:8px;padding:9px 11px;margin-bottom:8px;cursor:pointer}
  .preset:hover{border-color:var(--accent)}
  .preset b{display:block;font-size:13px}
  .preset span{display:block;color:var(--dim);font-size:11.5px;margin-top:2px}
  label.f{display:block;margin:12px 0 4px;color:var(--dim);font-size:12px}
  input[type=text],textarea,select{width:100%;background:#0c1120;border:1px solid var(--edge);color:var(--ink);
          border-radius:7px;padding:8px 10px;font-family:var(--mono);font-size:13px}
  textarea{resize:vertical;white-space:pre-wrap;word-break:break-word;line-height:1.45}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row>div{flex:1;min-width:90px}
  .seg{display:inline-flex;border:1px solid var(--edge);border-radius:7px;overflow:hidden;flex-wrap:wrap}
  .seg button{background:#0c1120;color:var(--dim);border:0;padding:6px 12px;cursor:pointer;font-size:12.5px}
  .seg button.on{background:var(--accent);color:#04102a;font-weight:600}

  legend{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.07em;padding:0 6px}
  .derivlist{max-height:200px;overflow:auto;border:1px solid var(--edge);border-radius:8px;padding:4px;background:#0c1120}
  .derivrow{display:flex;align-items:baseline;gap:8px;padding:6px 7px;border-radius:6px;cursor:pointer}
  .derivrow:hover{background:var(--panel2)}
  .derivrow b{font-size:12.5px;min-width:66px}
  .derivrow code{color:var(--accent);font-size:11.5px;font-family:var(--mono)}
  .derivrow .apps{color:var(--dim);font-size:11px;margin-left:auto;text-align:right;max-width:46%}
  .hint{color:var(--dim);font-size:11.5px;margin:4px 0 0}
  .verdict{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:650;padding:11px 13px;border-radius:9px;margin-bottom:14px}
  .verdict .dot{width:13px;height:13px;border-radius:50%}
  .verdict.green{background:rgba(46,193,107,.13);color:var(--green)} .verdict.green .dot{background:var(--green)}
  .verdict.yellow{background:rgba(230,184,0,.13);color:var(--yellow)} .verdict.yellow .dot{background:var(--yellow)}
  .verdict.red{background:rgba(239,83,80,.13);color:var(--red)} .verdict.red .dot{background:var(--red)}
  .big{font-size:25px;font-weight:700;font-family:var(--mono);word-break:break-all;cursor:help}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:10px 0}
  .kv .k{color:var(--dim)} .kv .v{font-family:var(--mono);text-align:right;word-break:break-all}
  .card{background:var(--panel2);border:1px solid var(--edge);border-radius:9px;padding:12px 13px;margin-bottom:12px}
  .card h3{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim)}
  .levers li{margin:3px 0;color:var(--ink)}
  .note{color:var(--dim);font-size:12px;margin:4px 0}
  .warnmsg{color:var(--yellow);font-size:12.5px;margin:4px 0}
  .err{color:var(--red);font-family:var(--mono);font-size:12.5px;white-space:pre-wrap}
  .sample code{display:block;font-family:var(--mono);font-size:12px;color:#cdd7f2;padding:1px 0;white-space:pre-wrap;word-break:break-all}
  .sample code.bad{color:#7d8aa8;text-decoration:line-through}
  .sample code .ix{color:var(--dim)}
  .pill{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:20px;background:var(--panel2);border:1px solid var(--edge);color:var(--dim);margin-left:6px}
  .dictlist{margin-top:14px}
  .dictlist .d{display:flex;justify-content:space-between;background:var(--panel2);border:1px solid var(--edge);border-radius:7px;padding:7px 10px;margin-bottom:6px;font-family:var(--mono);font-size:12.5px}
  .muted{color:var(--dim)}
  button.act{background:var(--accent);color:#04102a;border:0;border-radius:7px;padding:8px 14px;font-weight:600;cursor:pointer;margin-top:10px}
  a{color:var(--accent)}
  #booting{padding:30px 18px;color:var(--dim)}

  <h1>bip39rxcrack <span class="muted" style="font-weight:400">effort estimator</span></h1>
  <span class="motto" data-i18n="tagline">Cracking hard is alright, but smart is better.</span>
  <span class="warn" data-i18n-html="warnbar"></span>
  <span class="langSeg" id="langSeg"><button data-l="en" class="on">EN</button><button data-l="pt">PT</button></span>
</header>

<div class="tabs">
  <div class="tab active" data-view="est" data-i18n="tabEst">Estimator</div>
  <div class="tab" data-view="dict" data-i18n="tabDict">Dictionaries</div>
</div>

<div id="booting" data-i18n="booting">loading librxe→wasm core…</div>

<!-- ESTIMATOR VIEW -->
<div class="view" id="view-est">
 <div class="cols">

  </div>

  <div class="pane form">

      </div>
      <textarea id="wordsPat" rows="3">legal winner thank year wave sausage worth useful legal winner thank [:bip39-en:]</textarea>

          <div class="hint" style="align-self:end" data-i18n-html="anyHint"></div>

    <fieldset>
      <legend data-i18n="target">Target</legend>
      <label class="f" data-i18n="addrLabel">Paste your full address or xpub</label>
      <input id="addr" type="text" placeholder="bc1q… / 1… / 3… / bc1p… / xpub… / ypub… / zpub…">

        <div id="changeWrap"><label class="f" data-i18n="chains">chains</label>

        <div id="gapWrap"><label class="f" data-i18n="gap">address gap</label><input id="gap" class="num" type="text" value="1"></div>

    </fieldset>

    <fieldset>
      <legend data-i18n="engine">Engine</legend>
      <div class="seg" id="backendSeg">
        <button data-b="cpu" class="on">CPU</button>
        <button data-b="gpu">GPU</button>
      </div>
      <span id="coresWrap" style="margin-left:12px"><label class="f" style="display:inline" data-i18n="cores">cores</label>
        <input id="cores" class="num" type="text" value="8" style="display:inline;width:60px"></span>
      <div style="margin-top:10px"><button class="act" id="benchBtn" data-i18n="benchBtn" style="margin-top:0">⏱ Benchmark this browser</button>
        <span class="hint" id="benchInfo" style="margin-left:10px"></span></div>
    </fieldset>
  </div>

  <div class="pane results" id="results"></div>
 </div>
</div>

<!-- DICTIONARIES VIEW -->
<div class="view" id="view-dict">
  <div class="pane" style="max-width:720px">
    <h2 data-i18n="dictTitle">Custom dictionaries</h2>
    <p class="note" data-i18n-html="dictIntro"></p>
    <label class="f" data-i18n="dictName">Dictionary name</label>
    <input id="dName" type="text" value="mywords" style="max-width:260px">
    <label class="f" data-i18n="dictWords">Words — one per line</label>
    <textarea id="dWords" rows="7" placeholder="hunter2&#10;fluffy&#10;summer2019"></textarea>
    <button class="act" id="dAdd" data-i18n="dictAdd">Register dictionary</button>
    <div class="dictlist" id="dictList"></div>
  </div>
</div>

<script src="../wasm/rxecore.js"></script>
<script src="../wasm/rxecore_api.js"></script>
<script src="../estimator/bip39.js"></script>
<script src="../estimator/model.js"></script>
<script src="../estimator/wordset.js"></script>
<script src="../estimator/bip39crypto.js"></script>
<script src="../estimator/i18n.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
let RXE, VALIDATOR;
const registered = new Map();
let liveSets = [];
let debounce;
let calibration = null;      // set by the in-browser benchmark (CPU/JS)
let LANG = 'en';
let t = EstI18N.makeT('en');
const VERDICT_WORD = { en:{green:'GREEN',yellow:'YELLOW',red:'RED'}, pt:{green:'VERDE',yellow:'AMARELO',red:'VERMELHO'} };

// ---- derivation catalogue (language-neutral) ----
const DERIVS = [
  { p:'bip44', name:'BIP44', path:"m/44'/0'/a'/c/i", apps:'Ledger, Trezor, Coinomi, Exodus, Mycelium' },
  { p:'bip49', name:'BIP49', path:"m/49'/0'/a'/c/i", apps:'Ledger, Trezor, Coinomi, BlueWallet' },
  { p:'bip84', name:'BIP84', path:"m/84'/0'/a'/c/i", apps:'Ledger, Trezor, Sparrow, BlueWallet, Muun, Bitcoin Core' },
  { p:'bip86', name:'BIP86', path:"m/86'/0'/a'/c/i", apps:'Sparrow, Bitcoin Core, recent Ledger/Trezor' },
  { p:'electrum', name:'Electrum', path:"m/0'/{0,1}/i", apps:'Electrum (legacy & segwit)' },
];

// ---- number formatting (mirrors jsrxe) ----
function fmtBig(b){
  const v = (typeof b === 'bigint') ? b : BigInt(Math.round(Number(b)||0));
  return v.toLocaleString(LANG === 'pt' ? 'pt-BR' : 'en-US');
}
function spoken(s){
  if (s == null) return '';
  const d = s.length, g = Math.floor((d - 1) / 3);
  if (g < 1) return '';
  const table = EstI18N.SCALES[LANG] || EstI18N.SCALES.en;
  if (g >= table.length) return `${t('spokenDigitsPre')} ${fmtBig(BigInt(d))} ${t('spokenDigitsPost')}`;
  const intLen = d - 3 * g;
  const head = s.slice(0, Math.min(d, intLen + 4));
  const mant = Number(head) / Math.pow(10, head.length - intLen);
  const nice = mant >= 100 ? Math.round(mant / 10) * 10
             : mant >= 10  ? Math.round(mant)
             :               Math.round(mant * 10) / 10;
  const spokenValue = BigInt(Math.round(nice * 10)) * (10n ** BigInt(3 * g - 1));
  const actual = BigInt(s);
  const lead = actual === spokenValue ? t('spokenExactly')
             : actual <  spokenValue  ? t('spokenBitLess')
             :                          t('spokenBitMore');
  let word = table[g];
  if (LANG === 'pt' && nice >= 2 && word.endsWith('ão')) word = word.slice(0, -2) + 'ões';
  const mantStr = Number.isInteger(nice) ? String(nice) : String(nice).replace('.', LANG==='pt'?',':'.');
  return `${lead} ${mantStr} ${word}`;
}

// Post-localize model.js humanTime() output (its unit words are English). Keeps
// the tested model untouched; a deeper pass could key the model's prose too.
function localizeTime(s){
  if(LANG!=='pt'||!s) return s;
  return s.replace(/\bseconds?\b/g,m=>m==='second'?'segundo':'segundos')
          .replace(/\bminutes?\b/g,m=>m==='minute'?'minuto':'minutos')
          .replace(/\bhours?\b/g,m=>m==='hour'?'hora':'horas')
          .replace(/\bdays?\b/g,m=>m==='day'?'dia':'dias')
          .replace(/\byears?\b/g,m=>m==='year'?'ano':'anos')
          .replace(/\bunbounded\b/g,'ilimitado')
          .replace(/(\d)\.(\d)/g,'$1,$2');
}

// ---------- i18n apply ----------
function applyLang(){
  document.documentElement.lang = LANG;
  $$('[data-i18n]').forEach(el=>{ el.textContent = t(el.getAttribute('data-i18n')); });
  $$('[data-i18n-html]').forEach(el=>{ el.innerHTML = t(el.getAttribute('data-i18n-html')); });
  $$('[data-i18n-ph]').forEach(el=>{ el.placeholder = t(el.getAttribute('data-i18n-ph')); });
  buildPresets();
  renderDictList();
}
function setLang(l){
  LANG = l; t = EstI18N.makeT(l);
  setSeg('#langSeg','data-l',l);
  applyLang(); recompute();
}

// ---------- boot ----------
(async function boot(){
  try{
    const txt = await (await fetch('../data/english.txt')).text();
    const englishWords = txt.trim().split(/\r?\n/);
    RXE = await RxeCoreAPI.loadRxeCore({ moduleArgs:{ locateFile:p=>'../wasm/'+p } });
    RXE.registerDict('bip39-en', englishWords);
    registered.set('bip39-en', englishWords.length);
    VALIDATOR = BIP39.makeValidator(englishWords);
    $('#booting').style.display='none';
    $('#view-est').classList.add('active');
    buildDerivs(); wireUI(); applyLang(); applyTargetVis(); recompute();
  }catch(e){
    $('#booting').innerHTML = '<span class="err">failed to load wasm core: '+e.message+'</span>';
  }
})();

// ---------- tabs ----------
$$('.tab').forEach(tab=>tab.onclick=()=>{
  $$('.tab').forEach(x=>x.classList.remove('active'));
  $$('.view').forEach(x=>x.classList.remove('active'));
  tab.classList.add('active');
  $('#view-'+tab.dataset.view).classList.add('active');
});

// ---------- derivation list ----------
function buildDerivs(){
  $('#purposes').innerHTML = DERIVS.map(d=>
    `<label class="derivrow"><input type="checkbox" data-p="${d.p}"${d.p==='bip84'?' checked':''}>`+
    `<b>${d.name}</b><code>${d.path}</code><span class="apps">${d.apps}</span></label>`).join('');
  $$('#purposes input').forEach(c=>c.onchange=recompute);
}

// ---------- presets (bilingual) ----------
const PRESETS = [
  { title:{en:'Passphrase: prefix + case + digits',pt:'Frase-senha: prefixo + caixa + dígitos'},
    sub:{en:'known 12-word mnemonic, address (BIP84)',pt:'mnemônico de 12 conhecido, endereço (BIP84)'},
    mode:'passphrase', pass:'Correct(horse|Horse)?[0-9]{0,2}', target:'address', purposes:['bip84'], gap:'1' },
  { title:{en:'Passphrase: word + optional year',pt:'Frase-senha: palavra + ano opcional'},
    sub:{en:'address target, wider gap',pt:'alvo endereço, gap maior'},
    mode:'passphrase', pass:'[Tt]rezor(2019|2020|2021)?', target:'address', purposes:['bip84'], gap:'3' },
  { title:{en:'12-word: one missing word',pt:'12 palavras: uma faltando'},
    sub:{en:'dictionary at last position, xpub (BIP44)',pt:'dicionário na última posição, xpub (BIP44)'},
    mode:'words', wordsMode:'pattern', words:'legal winner thank year wave sausage worth useful legal winner thank [:bip39-en:]',
    target:'xpub', purposes:['bip44'] },
  { title:{en:'12-word: two missing words',pt:'12 palavras: duas faltando'},
    sub:{en:'sampled checksum survival, xpub (BIP84)',pt:'sobrevivência de checksum amostrada, xpub (BIP84)'},
    mode:'words', wordsMode:'pattern', words:'legal winner thank year wave sausage worth useful legal winner [:bip39-en:] [:bip39-en:]',
    target:'xpub', purposes:['bip84'] },
  { title:{en:'Words: known set, unknown order',pt:'Palavras: conjunto conhecido, ordem desconhecida'},
    sub:{en:'12 words permuted + checksum, xpub',pt:'12 palavras permutadas + checksum, xpub'},
    mode:'words', wordsMode:'anyorder',
    words:'legal winner thank year wave sausage worth useful abandon ability able about',
    target:'xpub', purposes:['bip84'] },
  { title:{en:'Electrum-style path',pt:'Caminho estilo Electrum'},
    sub:{en:'BIP39 seed used with Electrum paths',pt:'seed BIP39 usada com caminhos do Electrum'},
    mode:'passphrase', pass:'[Tt]rezor[0-9]{0,2}', target:'address', purposes:['electrum'], gap:'5' },
  { title:{en:'Joint (longshot): words × passphrase',pt:'Conjunto (tiro longo): palavras × frase-senha'},
    sub:{en:'product keyspace, xpub',pt:'espaço produto, xpub'},
    mode:'joint', wordsMode:'pattern', words:'legal winner thank year wave sausage worth useful legal winner thank [:bip39-en:]',
    pass:'[a-z]{1,3}', target:'xpub', purposes:['bip84'] },
];
function buildPresets(){
  const host = $('#presets'); host.innerHTML='';
  PRESETS.forEach(p=>{
    const b=document.createElement('button'); b.className='preset';
    b.innerHTML=`<b>${esc(p.title[LANG]||p.title.en)}</b><span>${esc(p.sub[LANG]||p.sub.en)}</span>`;
    b.onclick=()=>applyPreset(p);
    host.appendChild(b);
  });
}
function applyPreset(p){
  setMode(p.mode);
  setWordsMode(p.wordsMode||'pattern');
  if(p.pass!=null) $('#passPat').value=p.pass;
  if(p.words!=null) $('#wordsPat').value=p.words;
  $('#wordsK').value='';
  setSeg('#targetSeg','data-t',p.target||'address');
  $$('#purposes input').forEach(c=>c.checked=(p.purposes||['bip84']).includes(c.dataset.p));
  $('#accts').value=p.accounts||'1';
  $('#change').value=p.change||'1';
  $('#gap').value=p.gap||'1';
  applyTargetVis();
  recompute();
}

// ---------- UI wiring ----------
function setSeg(sel,attr,val){ $$(sel+' button').forEach(b=>b.classList.toggle('on',b.getAttribute(attr)===val)); }
function segVal(sel,attr){ const b=$(sel+' button.on'); return b?b.getAttribute(attr):null; }
function setMode(m){
  setSeg('#modeSeg','data-mode',m);
  $('#passBox').style.display=(m==='passphrase'||m==='joint')?'':'none';
  $('#wordsBox').style.display=(m==='words'||m==='joint')?'':'none';
}
function setWordsMode(wm){
  setSeg('#wordsModeSeg','data-wm',wm);
  $('#anyorderOpts').style.display=wm==='anyorder'?'':'none';
  $('#wordsHint').style.display=wm==='anyorder'?'none':'';
}
function applyTargetVis(){
  const xpub = segVal('#targetSeg','data-t')==='xpub';
  $('#gapWrap').style.display = xpub?'none':'';
  $('#changeWrap').style.display = xpub?'none':'';
  $('#gapHint').style.display = xpub?'none':'';
}
function detectTarget(addr){
  const a=(addr||'').trim(); if(!a) return null;
  if(/^xpub/i.test(a)) return {type:'xpub', p:'bip44', hard:false};
  if(/^ypub/i.test(a)) return {type:'xpub', p:'bip49', hard:true};
  if(/^zpub/i.test(a)) return {type:'xpub', p:'bip84', hard:true};
  if(/^bc1p/i.test(a)) return {type:'address', p:'bip86', hard:true};
  if(/^bc1q/i.test(a)) return {type:'address', p:'bip84', hard:true};
  if(/^1/.test(a))     return {type:'address', p:'bip44', hard:true};
  if(/^3/.test(a))     return {type:'address', p:'bip49', hard:true};
  return null;
}
function onAddr(){
  const det = detectTarget($('#addr').value);
  const info = $('#addrInfo');
  if(!det){ info.textContent = $('#addr').value.trim() ? t('unrecognized') : ''; recompute(); return; }
  setSeg('#targetSeg','data-t',det.type);
  if(det.hard) $$('#purposes input').forEach(c=>c.checked=(c.dataset.p===det.p));
  else { const b=$(`#purposes input[data-p="${det.p}"]`); if(b) b.checked=true; }
  const nm = DERIVS.find(d=>d.p===det.p);
  info.textContent = `${t('detected')} ${det.type==='xpub'?'xpub':t('tAddress').toLowerCase()} → ${nm?nm.name:det.p}`
    + (det.hard ? '' : ' '+t('xpubAmbiguous'));
  applyTargetVis(); recompute();
}
function wireUI(){
  $$('#langSeg button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
  $$('#modeSeg button').forEach(b=>b.onclick=()=>{setMode(b.dataset.mode);recompute();});
  $$('#wordsModeSeg button').forEach(b=>b.onclick=()=>{setWordsMode(b.dataset.wm);recompute();});
  $$('#targetSeg button').forEach(b=>b.onclick=()=>{setSeg('#targetSeg','data-t',b.dataset.t);applyTargetVis();recompute();});
  $$('#backendSeg button').forEach(b=>b.onclick=()=>{setSeg('#backendSeg','data-b',b.dataset.b);
    $('#coresWrap').style.display=b.dataset.b==='cpu'?'':'none';recompute();});
  ['#passPat','#wordsPat','#wordsK','#accts','#gap','#cores'].forEach(s=>$(s).addEventListener('input',schedule));
  $('#change').addEventListener('change',recompute);
  $('#addr').addEventListener('input',()=>{clearTimeout(debounce);debounce=setTimeout(onAddr,250);});
  $('#benchBtn').onclick=runBenchmark;
  $('#dAdd').onclick=addDict;
}
function schedule(){ clearTimeout(debounce); debounce=setTimeout(recompute,300); }

// Measure the REAL per-candidate rate in THIS browser (JS-CPU, 1 core): PBKDF2
// x2048 + hardened derive, using the same proven crypto the cracker will use.
// Feeds input.calibration so the ETA flips from "assumed" to measured.
async function runBenchmark(){
  const btn=$('#benchBtn'), info=$('#benchInfo');
  btn.disabled=true; info.textContent=t('benchRunning');
  await new Promise(r=>setTimeout(r,30));           // let the label paint
  const C=window.BIP39Crypto;
  const mn='legal winner thank year wave sausage worth useful legal winner thank yellow';
  for(let i=0;i<4;i++) C.accountNode(C.mnemonicToSeed(mn,'w'+i),84);   // warm JIT
  const t0=performance.now(); let n=0;
  do { for(let k=0;k<8;k++){ C.accountNode(C.mnemonicToSeed(mn,'c'+n),84); n++; } }
  while(performance.now()-t0<1200);
  const rate=n/((performance.now()-t0)/1000);
  calibration={ source:t('benchDone'), cpu:{ kdfPerCore: rate } };
  info.textContent=`${fmtBig(Math.round(rate))} cand/s/core`;
  btn.disabled=false; recompute();
}

// ---------- recompute ----------
function freeLive(){ liveSets.forEach(s=>{try{s.free()}catch(e){}}); liveSets=[]; }
function currentMnemonicPattern(mode){
  if(!(mode==='words'||mode==='joint')) return null;
  const wm = segVal('#wordsModeSeg','data-wm');
  if(wm==='anyorder'){
    const kRaw = parseInt($('#wordsK').value,10);
    const k = (Number.isFinite(kRaw) && kRaw>0) ? kRaw : null;
    return WordSet.buildWordSetPattern($('#wordsPat').value, { k, ordered:true });
  }
  return $('#wordsPat').value.trim();
}
function recompute(){
  freeLive();
  const mode = segVal('#modeSeg','data-mode');
  const target = segVal('#targetSeg','data-t');
  const backend = segVal('#backendSeg','data-b');
  $('#targetNote').textContent = target==='xpub' ? t('noteXpub') : t('noteAddr');
  const purposes = $$('#purposes input').filter(c=>c.checked).map(c=>c.dataset.p);
  const input = {
    passphrasePattern: (mode==='passphrase'||mode==='joint') ? $('#passPat').value.trim() : null,
    mnemonicKnown: mode==='passphrase',
    mnemonicPattern: currentMnemonicPattern(mode),
    targetType: target, backend,
    cores: parseInt($('#cores').value,10)||1,
    calibration: (backend==='cpu') ? calibration : null,
    path:{ purposes: purposes.length?purposes:['bip84'],
           accounts:parseInt($('#accts').value,10)||1,
           change:parseInt($('#change').value,10)||1,
           gap:parseInt($('#gap').value,10)||1 },
    exactThreshold:50000, sampleSize:5000,
  };
  let r;
  try{ r = BIP39Estimator.estimate(input,{rxe:RXE,validator:VALIDATOR}); }
  catch(e){ $('#results').innerHTML='<div class="card"><h3>parse error</h3><div class="err">'+esc(e.message)+'</div></div>'; return; }
  render(r, input);
  liveSets = [r._sets.passSet, r._sets.wordsSet].filter(Boolean);
}

// ---------- render ----------
function bigVal(b){ if(b===null||b===undefined) return '∞ '+t('unboundedShort'); const s=(typeof b==='bigint'?b:BigInt(b)).toString(); return `<span title="${esc(spoken(s))}">${fmtBig(b)}</span>`; }
function render(r, input){
  const v = r.verdict;
  const vw = (VERDICT_WORD[LANG]||VERDICT_WORD.en)[v];
  let html = `<div class="verdict ${v}"><span class="dot"></span>${vw} — ${r.unbounded?t('unbounded'):(r.eta?(t('exhaustIn')+' '+localizeTime(r.eta.timeToExhaust)):'')}</div>`;

  const totalStr = r.totalCandidates===null ? null : r.totalCandidates.toString();
  html += `<div class="card"><h3>${t('totalCandidates')} <span class="pill">${t('dimPill')}</span></h3>
    <div class="big"${totalStr?` title="${esc(spoken(totalStr))}"`:''}>${r.unbounded?t('unboundedShort'):fmtBig(r.totalCandidates)}</div>`;
  const kv=[];
  if(r.passphrase) kv.push([t('kPassSet'), r.passphrase.infinite?('∞ '+t('unboundedShort')):bigVal(r.passphrase.cardinality)]);
  if(r.mnemonic&&r.mnemonic.survival){
    const s=r.mnemonic.survival;
    if(s.infinite) kv.push([t('kMnemRaw'),'∞ '+t('unboundedShort')]);
    else{
      kv.push([t('kMnemRaw'),bigVal(s.raw)]);
      kv.push([`${t('kChecksum')} (${s.method})`, bigVal(s.validCount)+`  (${(s.fraction*100).toPrecision(3)}%)`]);
    }
  }
  if(r.mode==='joint'&&!r.unbounded) kv.push([t('kDim1'), bigVal(r.dim1)]);
  kv.push([t('kPathMult'), '×'+r.pathPlan.value+(r.pathPlan.collapsed?' ('+t('collapsed')+')':'')]);
  html += '<div class="kv">'+kv.map(([k,val])=>`<div class="k">${k}</div><div class="v">${val}</div>`).join('')+'</div></div>';

  if(r.eta){
    html += `<div class="card"><h3>${t('etaTitle')} <span class="pill">${r.eta.calibrated?t('etaCalibrated'):t('etaAssumed')}</span></h3>
      <div class="kv">
        <div class="k">${t('etaExhaust')}</div><div class="v">${localizeTime(r.eta.timeToExhaust)}</div>
        <div class="k">${t('etaHit')}</div><div class="v">${localizeTime(r.eta.expectedTimeToHit)}</div>
        <div class="k">${t('etaRate')}</div><div class="v">${fmtBig(Math.round(r.eta.kdfRate))}/s KDF${input.backend==='cpu'?' ('+input.cores+' '+t('cores')+')':''}</div>
      </div>
      <div class="note">${esc(r.eta.note)} ${esc(r.eta.rateSource)}.</div></div>`;
  }

  if(r.warnings.length) html+=`<div class="card">${r.warnings.map(w=>`<div class="warnmsg">⚠ ${esc(w)}</div>`).join('')}</div>`;
  if(r.notes.length) html+=`<div class="card"><h3>${t('notes')}</h3>${r.notes.map(n=>`<div class="note">• ${esc(n)}</div>`).join('')}</div>`;
  if(r.narrowingLevers.length)
    html+=`<div class="card"><h3>${t('levers')}</h3><ul class="levers">${r.narrowingLevers.map(l=>`<li>${esc(l)}</li>`).join('')}</ul></div>`;

  html+=`<div class="card sample"><h3>${t('dryRun')} <span class="pill">${t('viaUnrank')}</span></h3>${sampleHTML(r)}</div>`;
  $('#results').innerHTML=html;
}

function sampleHTML(r){
  const mode=r.mode;
  const set = (mode==='words')?r._sets.wordsSet : r._sets.passSet || r._sets.wordsSet;
  if(!set) return '<div class="note">'+t('nothingSample')+'</div>';
  if(set.isInfinite()) return '<div class="note">'+t('sampleUnbounded')+'</div>';
  const N=set.cardinality(); if(N===null) return '<div class="note">'+t('unboundedShort')+'.</div>';
  const showWords = (mode==='words'||mode==='joint');
  const n=6; const out=[];
  const cap = N<BigInt(n)?Number(N):n;
  out.push('<div class="note">'+t('firstN')+' '+cap+':</div>');
  for(let i=0;i<cap;i++){ out.push(line(set,BigInt(i),showWords)); }
  if(N>BigInt(n)){
    out.push('<div class="note" style="margin-top:6px">'+t('randomN')+' '+n+':</div>');
    for(let k=0;k<n;k++){ const i=BigInt(Math.floor(Math.random()*Number(N))); out.push(line(set,i,showWords)); }
  }
  if(mode==='joint') out.push('<div class="note" style="margin-top:6px">'+t('jointSample')+'</div>');
  return out.join('');
}
function line(set,i,checkValid){
  let s=set.unrank(i); if(s===null) return '';
  const bad = checkValid && !VALIDATOR.isValid(s);
  const disp = checkValid ? s.trim().replace(/\s+/g,' ') : s;
  return `<code class="${bad?'bad':''}"><span class="ix">#${i}</span> ${esc(disp)}${checkValid?(bad?' ✗':' ✓'):''}</code>`;
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

// ---------- dictionaries ----------
function addDict(){
  const name=$('#dName').value.trim();
  if(!/^[A-Za-z0-9_-]+$/.test(name)){ alert('name must be letters/digits/dash'); return; }
  const words=$('#dWords').value.split(/\r?\n/).map(w=>w.trim()).filter(Boolean);
  if(!words.length){ alert('add at least one word'); return; }
  try{ RXE.registerDict(name,words); registered.set(name,words.length); renderDictList(); }
  catch(e){ alert('register failed: '+e.message); }
}
function renderDictList(){
  const host=$('#dictList'); if(!host) return; host.innerHTML='<h2 style="margin-top:18px">'+t('dictRegistered')+'</h2>';
  for(const [n,c] of registered){
    const d=document.createElement('div'); d.className='d';
    d.innerHTML=`<span>[:${esc(n)}:]</span><span class="muted">${c} ${t('dictWordsN')}</span>`;
    host.appendChild(d);
  }
}
</script>
