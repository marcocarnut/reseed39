<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bip39rxcrack — keyspace / effort estimator</title>
<link rel="icon" href="data:,">
<style>
  :root{
    --bg:#0f1420; --panel:#171e2e; --panel2:#1e2740; --edge:#2b3654;
    --ink:#e6ecfb; --dim:#93a0bf; --accent:#5b9dff; --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
    --green:#2ec16b; --yellow:#e6b800; --red:#ef5350;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{padding:12px 18px;border-bottom:1px solid var(--edge);display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  header h1{font-size:17px;margin:0;font-weight:650}
  header .motto{color:var(--dim);font-style:italic;font-size:12.5px}
  header .warn{margin-left:auto;color:var(--yellow);font-size:12px;max-width:340px;text-align:right}
  .langSeg{display:inline-flex;border:1px solid var(--edge);border-radius:6px;overflow:hidden;margin-left:10px}
  .langSeg button{background:#0c1120;color:var(--dim);border:0;padding:3px 9px;cursor:pointer;font-size:11.5px}
  .langSeg button.on{background:var(--accent);color:#04102a;font-weight:600}
  .tabs{display:flex;gap:2px;padding:0 18px;border-bottom:1px solid var(--edge);background:var(--panel)}
  .tab{padding:9px 16px;cursor:pointer;color:var(--dim);border-bottom:2px solid transparent;user-select:none}
  .tab.active{color:var(--ink);border-bottom-color:var(--accent)}
  .view{display:none}
  .view.active{display:block}
  .cols{display:grid;grid-template-columns:230px minmax(340px,1fr) minmax(320px,1.1fr);gap:0;min-height:calc(100vh - 96px)}
  .pane{padding:16px 18px;overflow:auto}
  .pane.presets{border-right:1px solid var(--edge);background:var(--panel)}
  .pane.form{border-right:1px solid var(--edge)}
  .pane.results{background:var(--panel)}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:0 0 10px}
  .preset{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--edge);color:var(--ink);
          border-radius:8px;padding:9px 11px;margin-bottom:8px;cursor:pointer}
  .preset:hover{border-color:var(--accent)}
  .preset b{display:block;font-size:13px}
  .preset span{display:block;color:var(--dim);font-size:11.5px;margin-top:2px}
  label.f{display:block;margin:12px 0 4px;color:var(--dim);font-size:12px}
  input[type=text],textarea,select{width:100%;background:#0c1120;border:1px solid var(--edge);color:var(--ink);
          border-radius:7px;padding:8px 10px;font-family:var(--mono);font-size:13px}
  textarea{resize:vertical;white-space:pre-wrap;word-break:break-word;line-height:1.45}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row>div{flex:1;min-width:90px}
  .seg{display:inline-flex;border:1px solid var(--edge);border-radius:7px;overflow:hidden;flex-wrap:wrap}
  .seg button{background:#0c1120;color:var(--dim);border:0;padding:6px 12px;cursor:pointer;font-size:12.5px}
  .seg button.on{background:var(--accent);color:#04102a;font-weight:600}
  .num{width:70px}
  fieldset{border:1px solid var(--edge);border-radius:9px;margin:14px 0 0;padding:12px}
  legend{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.07em;padding:0 6px}
  .derivlist{max-height:200px;overflow:auto;border:1px solid var(--edge);border-radius:8px;padding:4px;background:#0c1120}
  .derivrow{display:flex;align-items:baseline;gap:8px;padding:6px 7px;border-radius:6px;cursor:pointer}
  .derivrow:hover{background:var(--panel2)}
  .derivrow b{font-size:12.5px;min-width:66px}
  .derivrow code{color:var(--accent);font-size:11.5px;font-family:var(--mono)}
  .derivrow .apps{color:var(--dim);font-size:11px;margin-left:auto;text-align:right;max-width:46%}
  .hint{color:var(--dim);font-size:11.5px;margin:4px 0 0}
  .verdict{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:650;padding:11px 13px;border-radius:9px;margin-bottom:14px}
  .verdict .dot{width:13px;height:13px;border-radius:50%}
  .verdict.green{background:rgba(46,193,107,.13);color:var(--green)} .verdict.green .dot{background:var(--green)}
  .verdict.yellow{background:rgba(230,184,0,.13);color:var(--yellow)} .verdict.yellow .dot{background:var(--yellow)}
  .verdict.red{background:rgba(239,83,80,.13);color:var(--red)} .verdict.red .dot{background:var(--red)}
  .big{font-size:25px;font-weight:700;font-family:var(--mono);word-break:break-all;cursor:help}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:10px 0}
  .kv .k{color:var(--dim)} .kv .v{font-family:var(--mono);text-align:right;word-break:break-all}
  .card{background:var(--panel2);border:1px solid var(--edge);border-radius:9px;padding:12px 13px;margin-bottom:12px}
  .card h3{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim)}
  .levers li{margin:3px 0;color:var(--ink)}
  .note{color:var(--dim);font-size:12px;margin:4px 0}
  .warnmsg{color:var(--yellow);font-size:12.5px;margin:4px 0}
  .err{color:var(--red);font-family:var(--mono);font-size:12.5px;white-space:pre-wrap}
  .sample code{display:block;font-family:var(--mono);font-size:12px;color:#cdd7f2;padding:1px 0;white-space:pre-wrap;word-break:break-all}
  .sample code.bad{color:#7d8aa8;text-decoration:line-through}
  .sample code .ix{color:var(--dim)}
  .pill{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:20px;background:var(--panel2);border:1px solid var(--edge);color:var(--dim);margin-left:6px}
  .dictlist{margin-top:14px}
  .dictlist .d{display:flex;justify-content:space-between;background:var(--panel2);border:1px solid var(--edge);border-radius:7px;padding:7px 10px;margin-bottom:6px;font-family:var(--mono);font-size:12.5px}
  .muted{color:var(--dim)}
  button.act{background:var(--accent);color:#04102a;border:0;border-radius:7px;padding:8px 14px;font-weight:600;cursor:pointer;margin-top:10px}
  button.act.resuming{background:#16a34a;color:#04140a;animation:resumepulse 1.6s ease-in-out infinite}
  @keyframes resumepulse{0%,100%{box-shadow:0 0 0 0 rgba(22,163,74,.55)}50%{box-shadow:0 0 0 6px rgba(22,163,74,0)}}
  a{color:var(--accent)}
  #booting{padding:30px 18px;color:var(--dim)}
  /* modal dialogs (benchmark, dry-run sample) */
  .overlay{position:fixed;inset:0;background:rgba(5,8,16,.66);display:none;align-items:center;justify-content:center;z-index:50}
  .overlay.on{display:flex}
  .modal{background:var(--panel);border:1px solid var(--edge);border-radius:12px;max-width:560px;width:92%;max-height:82vh;
         display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .modal h3{margin:0;padding:14px 16px;border-bottom:1px solid var(--edge);font-size:14px;display:flex;align-items:center;gap:8px}
  .modal .body{padding:14px 16px;overflow:auto}
  .modal .foot{padding:12px 16px;border-top:1px solid var(--edge);display:flex;gap:10px;justify-content:flex-end}
  .modal .x{margin-left:auto;cursor:pointer;color:var(--dim);font-size:18px;line-height:1;background:none;border:0}
  button.ghost{background:transparent;border:1px solid var(--edge);color:var(--ink);border-radius:7px;padding:7px 13px;cursor:pointer;font-weight:600}
  button.ghost:hover{border-color:var(--accent)}
  button.act:disabled,.seg button:disabled{opacity:.4;cursor:not-allowed}
  .benchstep{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--edge);font-family:var(--mono);font-size:12.5px}
  .benchstep:last-child{border-bottom:0}
  .benchstep .st{color:var(--dim)}
  .benchcard{background:var(--panel2);border:1px solid var(--edge);border-radius:9px;padding:10px 12px;margin-bottom:12px;font-size:12.5px}
  .benchcard .row2{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:space-between}
  .benchcard .gid{font-family:var(--mono);color:var(--accent);font-size:11.5px;word-break:break-word}
  .cta{background:rgba(91,157,255,.1);border:1px dashed var(--accent);border-radius:9px;padding:14px;margin-bottom:14px;text-align:center}
  .foundname{font-family:var(--mono);font-size:19px;font-weight:700;word-break:break-word;margin:8px 0;color:var(--ink)}
  .plabel{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);margin:0 0 6px;font-weight:650}
  .rightbtns{display:flex;gap:10px;margin:0 0 14px}
</style>

<!-- ESTIMATOR VIEW -->
<div class="view" id="view-est">
 <div class="cols">
  <div class="pane presets">

 </div>

     during dev (python http.server sends no cache headers). Bump on each change. -->
<script src="../estimator/bip39.js?v=b49"></script>
<script src="../estimator/model.js?v=b49"></script>
<script src="../estimator/wordset.js?v=b49"></script>

<script>
'use strict';
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
let RXE, VALIDATOR, ENGLISH = [];   // ENGLISH: wordlist, passed to crack workers
const registered = new Map();
let liveSets = [];
let debounce;
let calCpu = null, calGpu = null;   // measured rates per backend (in-browser benchmark)
let cracking = false;        // in-browser crack in progress
let _crackAbort = false;     // Stop (discard checkpoint) vs Pause (keep it) -- see onCrack
let _crackPaused = false;    // module mirror of a resumable pause, so the Stop handler (a separate closure) can bail out from paused
let _restoring = false;      // true while restoreCrackParams repopulates fields -> suppresses the edit auto-reset (which would wipe the checkpoint we're resuming)
let _wsAckPat = null;        // pattern the user already OK'd past the whitespace warning
let lastR = null;            // last estimate result (for the dry-run modal)
let LANG = 'en';
let t = EstI18N.makeT('en');
const VERDICT_WORD = { en:{green:'GREEN',yellow:'YELLOW',red:'RED'}, pt:{green:'VERDE',yellow:'AMARELO',red:'VERMELHO'} };

// 9-tier feasibility scale (emoji + localized label; color drives styling).
const TIER = {
  trivial: {emoji:'😉', color:'green',  en:'TRIVIAL',          pt:'TRIVIAL'},
  veryEasy:{emoji:'😄', color:'green',  en:'VERY EASY',        pt:'MUITO FÁCIL'},
  easy:    {emoji:'🙂', color:'green',  en:'EASY',             pt:'FÁCIL'},
  days:    {emoji:'😐', color:'yellow', en:'A MATTER OF DAYS', pt:'QUESTÃO DE DIAS'},
  weeks:   {emoji:'🙁', color:'yellow', en:'A MATTER OF WEEKS',pt:'QUESTÃO DE SEMANAS'},
  months:  {emoji:'😟', color:'yellow', en:'A MATTER OF MONTHS',pt:'QUESTÃO DE MESES'},
  years:   {emoji:'😧', color:'red',    en:'A MATTER OF YEARS',pt:'QUESTÃO DE ANOS'},
  decades: {emoji:'😱', color:'red',    en:'DECADES LONG',     pt:'DÉCADAS'},
  hopeless:{emoji:'💀', color:'red',    en:'HOPELESS',         pt:'SEM ESPERANÇA'},
};
function tierLabel(key){ const x=TIER[key]||TIER.hopeless; return x.emoji+' '+(x[LANG]||x.en); }
// Elapsed / remaining as "1d 2h 3m 4s" (drops leading-zero units).
function humanElapsed(sec){
  sec=Math.max(0,Math.round(sec)); if(sec<1) return '<1s';
  const d=Math.floor(sec/86400); sec-=d*86400;
  const h=Math.floor(sec/3600); sec-=h*3600;
  const m=Math.floor(sec/60); const s=sec-m*60;
  const p=[]; if(d)p.push(d+'d'); if(h||d)p.push(h+'h'); if(m||h||d)p.push(m+'m'); p.push(s+'s');
  return p.join(' ');
}

// ---- benchmark state (persisted in localStorage, keyed with the GPU id) ----
const BENCH_KEY = 'bip39rxcrack.bench.v1';
let BENCH = null;            // {gpuId, cpuKdf, cpuSweep, gpuKdf|null, ts} or null
let HAS_GPU = false;         // set at boot
let CUR_GPU_ID = '';         // detected current adapter id (for a mismatch hint)
function loadBench(){ try{ const s=localStorage.getItem(BENCH_KEY); BENCH = s?JSON.parse(s):null;
  // Pre-aggregate caches stored the sweep as a SINGLE-CORE rate; the corrected
  // model would x cores that (perfect-scaling fiction -> optimistic ETA). Drop
  // them so the browser re-benchmarks the real multicore/pipeline sweep rate.
  if(BENCH && BENCH.sweepAgg==null){ BENCH=null; localStorage.removeItem(BENCH_KEY); }
}catch(e){ BENCH=null; } }
function saveBench(){ try{ localStorage.setItem(BENCH_KEY, JSON.stringify(BENCH)); }catch(e){} }
// Feed the measured rates into the model's calibration slots (best-of for the estimate).
function applyBench(){
  if(!BENCH){ calCpu=null; calGpu=null; return; }
  const cpu={ kdfPerCore:BENCH.cpuKdf };
  if(BENCH.sweepAgg){ cpu.sweepAggregate=BENCH.sweepAgg; cpu.sweepCores=BENCH.sweepCores||null; } // measured multicore aggregate
  else if(BENCH.cpuSweep){ cpu.sweepPerCore=BENCH.cpuSweep; }   // back-compat: old cache stored per-core
  if(BENCH.ecMult) cpu.ecMultPerCore=BENCH.ecMult;   // measured host privToPub/s (older cache may lack it)
  calCpu = { source:(LANG==='pt'?'medido neste navegador':'measured on this browser'), cpu:{...cpu} };
  calGpu = BENCH.gpuKdf ? { source:(LANG==='pt'?'medido (WebGPU)':'measured (WebGPU)'),
             cpu:{...cpu}, gpu:{ kdf:BENCH.gpuKdf } } : null;
}

// ---- crack CHECKPOINT (localStorage; survives reload / crash / browser restart)
// Kept on-device on purpose: the params include the mnemonic PATTERN (fragments
// of the user's seed) -- never written to the URL. Cleared when the crack finishes
// (found or exhausted); kept on Stop and on a crash so it can be resumed.
const CKPT_KEY='bip39rxcrack.ckpt.v1';
let _resumeFrom=0, _resumeSig=null, _ckptLast=0;
function ckptSig(p){ return [p.mode,p.wordsPat,p.tseg,p.addr,p.reqChecksum?1:0,(p.changes||[]).join(','),p.gap,p.crackPass||''].join(''); }
function ckptSave(o){ try{ localStorage.setItem(CKPT_KEY, JSON.stringify(o)); }catch(e){} }
function ckptLoad(){ try{ const s=localStorage.getItem(CKPT_KEY); return s?JSON.parse(s):null; }catch(e){ return null; } }
function ckptClear(){ try{ localStorage.removeItem(CKPT_KEY); }catch(e){} _resumeFrom=0; _resumeSig=null; }
// Restore a saved crack's form inputs (so the estimator reflects the interrupted run).
function restoreCrackParams(p){
  // Checkpoints are only taken for words+GPU, so a restore always repopulates the
  // unified fields as a words-axis search: mnemonic pattern + the fixed passphrase.
  try{ _restoring=true;   // suppress the edit auto-reset so the checkpoint we're resuming survives
    $('#wordsPat').value=p.wordsPat||'';
    $('#passPat').value=p.crackPass||'';         // the fixed passphrase (may be blank)
    $('#reqChecksum').checked=!!p.reqChecksum;
    setSeg('#targetSeg','data-t',p.tseg||'xpub'); $('#addr').value=p.addr||'';
    if($('#change')) $('#change').value=(p.changes&&p.changes.length>1)?'2':'1';
    if($('#gap')) $('#gap').value=String(p.gap||1);
    onAddr(); recompute();
  }catch(e){}
  finally{ _restoring=false; }
}
// Boot / post-crack: show a "resume interrupted crack" banner if a checkpoint survived.
function renderResumeBar(){
  const bar=$('#resumeBar'); if(!bar) return;
  const ck=ckptLoad();
  if(!ck||!ck.params||!ck.total||!(ck.frontier>0)){ bar.style.display='none'; bar.innerHTML=''; return; }
  const pct=Math.min(100, ck.frontier/ck.total*100);
  const prev=(ck.params.wordsPat||'').replace(/</g,'&lt;');
  bar.setAttribute('style','display:block;margin:8px 0;padding:9px 13px;border:1px solid #ca8a04;background:rgba(202,138,4,0.13);border-radius:8px;font-size:13px');
  bar.innerHTML=`<span>⏸ ${t('resumeFound')} <b>${fmtBig(ck.frontier)}</b> / ${fmtBig(ck.total)} (${pct.toFixed(pct<0.1?3:1)}%) · <code style="opacity:.8">${prev.slice(0,56)}${prev.length>56?'…':''}</code></span>`
    +`<span style="float:right;white-space:nowrap"><button class="ghost" id="resumeGo">▶ ${t('resumeBtn')}</button> <button class="ghost" id="resumeDrop">${t('resumeDiscard')}</button></span>`;
  $('#resumeGo').onclick=()=>{ _resumeFrom=ck.frontier; _resumeSig=ckptSig(ck.params); restoreCrackParams(ck.params);
    bar.style.display='none'; openCrackModal(); onCrack(); };
  $('#resumeDrop').onclick=()=>{ ckptClear(); renderResumeBar(); };
}

// ---- derivation catalogue (language-neutral) ----
const DERIVS = [
  { p:'bip44', name:'BIP44', path:"m/44'/0'/a'/c/i", apps:'Ledger, Trezor, Coinomi, Exodus, Mycelium' },
  { p:'bip49', name:'BIP49', path:"m/49'/0'/a'/c/i", apps:'Ledger, Trezor, Coinomi, BlueWallet' },
  { p:'bip84', name:'BIP84', path:"m/84'/0'/a'/c/i", apps:'Ledger, Trezor, Sparrow, BlueWallet, Muun, Bitcoin Core' },
  { p:'bip86', name:'BIP86', path:"m/86'/0'/a'/c/i", apps:'Sparrow, Bitcoin Core, recent Ledger/Trezor' },

// ---- number formatting (mirrors jsrxe) ----
function fmtBig(b){
  const v = (typeof b === 'bigint') ? b : BigInt(Math.round(Number(b)||0));
  return v.toLocaleString(LANG === 'pt' ? 'pt-BR' : 'en-US');
}
function spoken(s){
  if (s == null) return '';
  const d = s.length, g = Math.floor((d - 1) / 3);
  if (g < 1) return '';
  const table = EstI18N.SCALES[LANG] || EstI18N.SCALES.en;
  if (g >= table.length) return `${t('spokenDigitsPre')} ${fmtBig(BigInt(d))} ${t('spokenDigitsPost')}`;
  const intLen = d - 3 * g;
  const head = s.slice(0, Math.min(d, intLen + 4));
  const mant = Number(head) / Math.pow(10, head.length - intLen);
  const nice = mant >= 100 ? Math.round(mant / 10) * 10
             : mant >= 10  ? Math.round(mant)
             :               Math.round(mant * 10) / 10;
  const spokenValue = BigInt(Math.round(nice * 10)) * (10n ** BigInt(3 * g - 1));
  const actual = BigInt(s);
  const lead = actual === spokenValue ? t('spokenExactly')
             : actual <  spokenValue  ? t('spokenBitLess')
             :                          t('spokenBitMore');
  let word = table[g];
  if (LANG === 'pt' && nice >= 2 && word.endsWith('ão')) word = word.slice(0, -2) + 'ões';
  const mantStr = Number.isInteger(nice) ? String(nice) : String(nice).replace('.', LANG==='pt'?',':'.');
  return `${lead} ${mantStr} ${word}`;
}

// Post-localize model.js humanTime() output (its unit words are English). Keeps
// the tested model untouched; a deeper pass could key the model's prose too.
function localizeTime(s){
  if(LANG!=='pt'||!s) return s;
  return s.replace(/\bseconds?\b/g,m=>m==='second'?'segundo':'segundos')
          .replace(/\bminutes?\b/g,m=>m==='minute'?'minuto':'minutos')
          .replace(/\bhours?\b/g,m=>m==='hour'?'hora':'horas')
          .replace(/\bdays?\b/g,m=>m==='day'?'dia':'dias')
          .replace(/\byears?\b/g,m=>m==='year'?'ano':'anos')
          .replace(/\bunbounded\b/g,'ilimitado')
          .replace(/(\d)\.(\d)/g,'$1,$2');
}

// One measurement run of each kind, for `ms` milliseconds -> rate (per second).
const _benchMn='legal winner thank year wave sausage worth useful legal winner thank yellow';
async function _measCpuKdf(ms){ const C=window.BIP39Crypto;
  for(let i=0;i<4;i++) C.accountNode(C.mnemonicToSeed(_benchMn,'w'+i),84);   // warm
  const t0=performance.now(); let n=0;
  do{ for(let k=0;k<8;k++){ C.accountNode(C.mnemonicToSeed(_benchMn,'c'+n),84); n++; } }while(performance.now()-t0<ms);
  return n/((performance.now()-t0)/1000); }
async function _measCpuSweep(ms){
  // Measure the REAL aggregate multicore sweep -- the way the cracker runs it:
  // N sweepOnly workers unrank + checksum-test in parallel. The old single-core
  // rate x cores assumed perfect scaling and overshot ~2x (measured ~44% on an
  // 8-core box), which made the ETA optimistic. A big 3-unknown-word set
  // (2048^3 ~ 8.6e9) guarantees it never exhausts inside the window.
  const cores = _benchCores();
  const pattern='legal winner thank year wave sausage worth useful legal winner thank year wave sausage worth useful legal winner thank year wave [:bip39-en:] [:bip39-en:] [:bip39-en:]';
  const total=2048*2048*2048;
  // With a GPU the estimate runs on the HYBRID (GPU seeds while CPU workers
  // sweep); there the sweep competes with GPU seeding + derive coordination for
  // the main thread, so its real rate is BELOW a pure worker sweep. Measure the
  // actual hybrid crack rate (unreachable target -> full sweep). No GPU -> pure
  // worker sweep (that's what the CPU-backend estimate will run).
  if(HAS_GPU && window.GpuCrack){
    const wrongTcc=window.BIP39Crypto.fromHex('11'.repeat(32));
    let rate=0; const t0=performance.now();
    await crackWordsHybrid({ pattern, passphrase:'', requireChecksum:true,
      plan:[{purpose:84,coin:0,account:0}], tcc:wrongTcc, taddr:null, changes:[0], gap:1,
      total, nWorkers:cores, onProgress:(tr,to,r)=>{ if(r) rate=r; },
      isCancelled:()=>(performance.now()-t0)>ms });
    return rate;
  }
  if(typeof Worker==='undefined'){                       // no workers: single-thread isolated
    const sset=RXE.parse(pattern); let m=0; const t0=performance.now();
    while(performance.now()-t0<ms){ const cs=sset.unrankBatch(m,1024); for(let k=0;k<cs.length;k++){ VALIDATOR.isValid(cs[k]); m++; } }
    sset.free(); return m/((performance.now()-t0)/1000);
  }
  const per=Math.ceil(total/cores), swept=new Array(cores).fill(0), workers=[];
  for(let k=0;k<cores;k++){
    let w; try{ w=new Worker('crackworker.js?v=b49'); }catch(e){ break; }
    workers.push(w);
    w.onmessage=(e)=>{ const m=e.data; if(m&&(m.type==='cand'||m.type==='progress')) swept[m.id]=m.swept; };
    const start=k*per, end=Math.min(total,(k+1)*per);
    w.postMessage({ type:'run', id:k, sweepOnly:true, wordlist:ENGLISH, pattern, mode:'words',
      passphrase:'', requireChecksum:true, plan:[{purpose:84,coin:0,account:0}],
      target:{kind:'xpub', chainCodeHex:'11'.repeat(32)}, changes:[0], gap:1, start, end });
  }
  if(!workers.length){ const sset=RXE.parse(pattern); let m=0; const t0=performance.now();
    while(performance.now()-t0<ms){ const cs=sset.unrankBatch(m,1024); for(let k=0;k<cs.length;k++){ VALIDATOR.isValid(cs[k]); m++; } }
    sset.free(); return m/((performance.now()-t0)/1000); }
  await new Promise(r=>setTimeout(r,700));                // let all workers spin up (exclude startup)
  const base=swept.reduce((a,b)=>a+b,0), t0=performance.now();
  await new Promise(r=>setTimeout(r, ms));
  const got=swept.reduce((a,b)=>a+b,0)-base, dt=(performance.now()-t0)/1000;
  workers.forEach(w=>{ try{ w.terminate(); }catch(e){} });
  return got/dt; }
function _benchCores(){ return Math.max(1, Math.min(parseInt($('#cores').value,10)||8, (navigator.hardwareConcurrency||8))); }
// Host secp256k1 privToPub rate -- the address crack's EC cost (W=8 comb).
async function _measEcMult(ms){ const C=window.BIP39Crypto;
  const k0=C.SECP_N/2n; C.privToPub(k0);   // warm + lazy comb build
  const t0=performance.now(); let n=0;
  while(performance.now()-t0<ms){ for(let i=0;i<50;i++){ C.privToPub((k0+BigInt(n))%C.SECP_N); n++; } }
  return n/((performance.now()-t0)/1000); }
async function _measGpuKdf(ms){
  const words=['abandon','ability','able','zoo','yellow','legal','winner','museum','sausage','worth'];
  const batch=[]; for(let i=0;i<8192;i++){ let s=''; for(let w=0;w<12;w++) s+=(s?' ':'')+words[(i+w*7)%words.length]; batch.push(s); }
  await window.GpuCrack.gpuSeedsWords(batch.slice(0,64),'');       // warm
  const t0=performance.now(); let n=0;
  while(performance.now()-t0<ms){ await window.GpuCrack.gpuSeedsWords(batch,''); n+=8192; }
  return n/((performance.now()-t0)/1000); }

// Rough = one ~5s run per test. Thorough = 3 x ~20s runs per test, keep the
// WORST (min) -- long enough for thermal throttling, so the sustained rate wins.
async function runBenchAll(){
  const run=$('#benchRun'); run.disabled=true;
  const set=(id,txt)=>{ const e=$('#bs-'+id); if(e) e.textContent=txt; };
  const yield_=()=>new Promise(r=>setTimeout(r,30));
  const thorough = $('#benchMode').value==='thorough';
  const per = thorough?20000:5000, runs = thorough?3:1;
  const worst = async (id, meas)=>{ let v=Infinity;
    for(let r=0;r<runs;r++){ set(id, runs>1?`${t('benchRunN')} ${r+1}/${runs}…`:'…'); await yield_(); v=Math.min(v, await meas(per)); set(id, fmtBig(Math.round(v))+(runs>1?` /s (${t('benchRunN')} ${r+1})`:' /s')); }
    return v; };
  try{
    const cpuKdf = await worst('cpuk', _measCpuKdf);   set('cpuk', fmtBig(Math.round(cpuKdf))+' /s/core');
    const sweepCores = _benchCores();
    const cpuSweep = await worst('cpus', _measCpuSweep); set('cpus', fmtBig(Math.round(cpuSweep))+` /s (${sweepCores} cores)`);
    const ecMult = await worst('ec', _measEcMult);     set('ec', fmtBig(Math.round(ecMult))+' /s');
    let gpuKdf=null, gpuId=CUR_GPU_ID||null;
    if(HAS_GPU && window.GpuCrack){
      try{ gpuId=(await window.GpuCrack.getGpuInfo())||gpuId; gpuKdf=await worst('gpuk', _measGpuKdf); set('gpuk', fmtBig(Math.round(gpuKdf))+' /s'); }
      catch(e){ set('gpuk','failed: '+e.message); }
    }
    BENCH={ gpuId, cpuKdf, sweepAgg:cpuSweep, sweepCores, ecMult, gpuKdf, depth:(thorough?'thorough':'rough'), ts:Date.now() };
    saveBench(); applyBench(); renderBenchCard(); recompute();
    run.textContent=t('benchDoneBtn');
    setTimeout(()=>{ closeBenchModal(); run.textContent=t('benchRun'); run.disabled=false; }, 700);
  }catch(e){ run.disabled=false; run.textContent=t('benchRun'); alert('benchmark failed: '+e.message); }
}

// ---------- in-browser crack (xpub OR address target, known mnemonic) ------
// Flag whitespace in the mnemonic that would make it never match a standard
// wallet: double (or more) spaces between words, or a leading/trailing space
// (mnemonicToSeed hashes the raw NFKD string -- no trimming -- so any extra space
// changes the seed). We check ONLY the CANONICAL first candidate (unrank 0): a
// structural typo (e.g. a double space in the fixed part of the pattern) appears
// in EVERY candidate incl. #0, so #0 catches it -- and #0 of a genuinely clean
// pattern is clean, so this never false-flags a correct pattern (an earlier
// multi-index probe could trip on a stray per-branch space that the winning
// candidate never has). Returns {label, sample} or null.
function patternWhitespaceIssue(set, card){
  if(card<=0n) return null;
  let s; try{ s=set.unrank(0n); }catch(e){ return null; }
  if(typeof s!=='string') return null;
  let label=null;
  if(/^ /.test(s)) label=t('crackWsLead');
  else if(/ $/.test(s)) label=t('crackWsTrail');
  else if(/ {2,}/.test(s)) label=t('crackWsDbl');

// varying mnemonic is the HMAC key, so the GPU midstate precompute (fixed key)
// doesn't apply. With requireChecksum (default), only checksum-valid wordlist
// mnemonics get hashed (~256x fewer); off, EVERY candidate is hashed (needed
// when the user may have used off-dictionary / custom words). The sweep over the
// raw set is cheap; wall-clock is set by the number actually SEEDED -- so we
// report both, else it looks like it's grinding the whole raw set at full cost.
async function cpuCrackWords(a){
  const C=window.BIP39Crypto, t0=performance.now();
  const isAddr=!!a.taddr;
  const plan=isAddr ? a.plan.filter(pp=>C.purposeType(pp.purpose)===a.taddr.type) : a.plan;

// Multicore CPU crack: shard [0,total) across N Web Workers, each running its
// own rxe core + the shared crypto (see crackworker.js). First hit wins (there
// is normally exactly one matching candidate); Stop or a hit terminate()s the
// pool. Falls back to the single-thread `o.single()` when workers are
// unavailable or the set is too small to be worth the ~per-worker startup.
// o: { mode, pattern, mnemonic?, passphrase?, requireChecksum, plan, target,
//      changes, gap, total, nWorkers, onProgress, isCancelled, single }
function cpuCrackMT(o){
  const nW = Math.max(1, Math.min(o.nWorkers||1, 32));
  if (nW<=1 || typeof Worker==='undefined' || o.total < 2048) return o.single();
  return new Promise((resolve)=>{
    const workers=[]; const swept=new Array(nW).fill(0), seeded=new Array(nW).fill(0);
    const t0=performance.now(); let finished=false, done=0, spawned=0;
    const cleanup=()=>{ workers.forEach(w=>{try{w.terminate()}catch(e){}}); clearInterval(poll); };
    const report=()=>{ const S=swept.reduce((a,b)=>a+b,0), G=seeded.reduce((a,b)=>a+b,0), el=(performance.now()-t0)/1000||1e-6;
      o.onProgress(S,o.total,S/el,{seeded:G,seedRate:G/el}); };
    const finish=(r)=>{ if(finished) return; finished=true; cleanup(); resolve(r); };
    const poll=setInterval(()=>{ if(o.isCancelled && o.isCancelled()) finish({stopped:true}); }, 200);
    const per=Math.ceil(o.total/nW);
    for (let k=0;k<nW;k++){
      const start=k*per, end=Math.min(o.total,(k+1)*per);
      if (start>=end) continue;
      spawned++;
      let w; try{ w=new Worker('crackworker.js?v=b49'); }catch(e){ cleanup(); return resolve(o.single()); }
      workers.push(w);
      w.onmessage=(e)=>{ const m=e.data; if(finished) return;
        if (m.type==='progress'){ swept[m.id]=m.swept; seeded[m.id]=m.seeded; report(); }
        else if (m.type==='hit'){ swept[m.id]=m.swept; seeded[m.id]=m.seeded; report(); finish({found:m.candidate, path:m.path, index:m.index}); }
        else if (m.type==='done'){ swept[m.id]=m.swept; seeded[m.id]=m.seeded; report(); if(++done>=spawned) finish({found:null}); }
        else if (m.type==='error'){ finish({error:m.message}); }
      };
      w.onerror=(ev)=>{ finish({error:(ev && ev.message)||'worker error'}); };
      w.postMessage({ type:'run', id:k, wordlist:ENGLISH, pattern:o.pattern, mode:o.mode,
        mnemonic:o.mnemonic||null, passphrase:o.passphrase||'', requireChecksum:o.requireChecksum,
        plan:o.plan, target:o.target, changes:o.changes, gap:o.gap, start, end, progressEvery:2000 });
    }
    if (spawned===0) finish({found:null});
  });
}

    const dWorkers=[], dIdle=[], dPending=new Map(); const dQueue=[];
    let dBatchId=0, dDispatched=0, dCompleted=0;
    const cleanup=()=>{ workers.forEach(w=>{try{w.terminate()}catch(e){}}); dWorkers.forEach(w=>{try{w.terminate()}catch(e){}}); clearInterval(poll); };
    const finish=(r)=>{ if(finished) return; finished=true; cleanup(); resolve(r); };
    const report=()=>{ const swept=curSwept(), el=(performance.now()-t0)/1000||1e-6;
      o.onProgress(swept,o.total,(swept-startAt)/el,{seeded:seededTotal,seedRate:seededTotal/el}); };
    const poll=setInterval(()=>{ if(o.isCancelled&&o.isCancelled()) finish({stopped:true}); },200);
    const maybeDone=()=>{ if(allSwept && !queue.length && !seeding && (dDispatched===dCompleted && !dQueue.length) && !finished) finish({found:null}); };
    // dispatch pending seed-batches to idle derive workers. Address = secp256k1
    // EC compare; xpub = EC-free chain-code compare -- both off the main thread.
    const deriveMsg = isAddr
      ? { addrType:o.taddr.type, programHex:C.toHex(o.taddr.program), changes, gap }
      : { targetKind:'xpub', chainCodeHex:C.toHex(o.tcc) };
    const drainDerive=()=>{ while(dIdle.length && dQueue.length && !finished){ const w=dIdle.shift(), task=dQueue.shift();
      dPending.set(task.batchId, task);
      w.postMessage(Object.assign({ type:'derive', batchId:task.batchId, seedsBuf:task.seedsBuf, n:task.batch.length, startIndex:0, plan }, deriveMsg), [task.seedsBuf]); } };
    {
      for(let i=0;i<nW;i++){ let w; try{ w=new Worker(WURL); }catch(e){ break; } dWorkers.push(w); dIdle.push(w);
        w.onmessage=(e)=>{ const m=e.data; if(finished) return;
          if(m.type==='derivehit'){ const task=dPending.get(m.batchId); const hitc=task.batch[m.index]; finish({found:hitc.mn, path:m.path, index:hitc.index}); }
          else if(m.type==='derivedone'){ dPending.delete(m.batchId); dCompleted++; dIdle.push(w); drainDerive(); pump(); maybeDone(); } };
        w.onerror=(ev)=>finish({error:(ev&&ev.message)||'derive worker error'});
      }
    }
    async function pump(){
      if(seeding||finished) return; seeding=true;
      while(queue.length && !finished){
        // backpressure: don't seed far ahead of the derive pool
        if(dQueue.length > nW*3){ break; }
        const batch=queue.splice(0,4096); const mns=batch.map(x=>x.mn);
        let seeds; try{ seeds=await window.GpuCrack.gpuSeedsWords(mns,o.passphrase); }catch(e){ finish({error:e.message}); return; }
        if(finished) return;
        seededTotal+=mns.length;
        // hand the seeds to a derive worker (parallel compare, off the main
        // thread -- EC for address, chain-code for xpub); transfer zero-copy.
        dQueue.push({ batchId:dBatchId++, seedsBuf:seeds.buffer, batch }); dDispatched++; drainDerive();
        report();
        await new Promise(r=>setTimeout(r,0));   // yield so the sweep keeps flowing
      }
      seeding=false;
      maybeDone();
    }
    // hand the next CHUNK to a worker; false when the keyspace is exhausted.
    const assign=(w,id)=>{
      if(cursor>=o.total) return false;
      const start=cursor, end=Math.min(o.total, cursor+CHUNK); cursor=end;
      inflight.set(id,{start,end}); sweptCur[id]=0;
      w.postMessage({ type:'run', id, sweepOnly:true, wordlist:ENGLISH, pattern:o.pattern, mode:'words',
        passphrase:o.passphrase||'', requireChecksum:o.requireChecksum, plan:o.plan,
        target: o.taddr ? {kind:'address',addrType:o.taddr.type,programHex:C.toHex(o.taddr.program)} : {kind:'xpub',chainCodeHex:C.toHex(o.tcc)},
        changes:o.changes, gap:o.gap, start, end });
      return true;
    };
    if(startAt>=o.total){ finish({found:null}); return; }
    const onSweepMsg=(w)=>(e)=>{ const m=e.data; if(finished) return;
      if(m.type==='cand'){ sweptCur[m.id]=m.swept; for(const it of m.items) queue.push(it); report(); pump(); }
      else if(m.type==='progress'){ sweptCur[m.id]=m.swept; report(); }
      else if(m.type==='done'){
        const chunk=inflight.get(m.id); inflight.delete(m.id);
        if(chunk){ sweptBase += (chunk.end-chunk.start); sweptCur[m.id]=0; completed.add(chunk.start);
          while(completed.has(frontier)){ completed.delete(frontier); frontier=Math.min(o.total, frontier+CHUNK); }
          if(o.onCheckpoint) try{ o.onCheckpoint(frontier); }catch(_){} }
        if(!assign(w, m.id) && cursor>=o.total && inflight.size===0) allSwept=true;
        report(); pump(); maybeDone();
      }
      else if(m.type==='error'){ finish({error:m.message}); }
    };
    for(let k=0;k<nW;k++){
      let w; try{ w=new Worker(WURL); }catch(e){ if(k===0){ finish({error:'worker spawn failed'}); return; } break; }
      workers.push(w); w.onmessage=onSweepMsg(w); w.onerror=(ev)=>finish({error:(ev&&ev.message)||'worker error'});
      if(!assign(w, k)) break;    // keyspace exhausted -> don't spawn further workers
    }
    if(inflight.size===0 && cursor>=o.total){ allSwept=true; maybeDone(); }
  });
}
// single-thread JS-CPU fallback (small sets / no WebGPU) -- xpub target, EC-free.
async function cpuCrack(a){
  const C=window.BIP39Crypto, t0=performance.now();
  for(let start=0;start<a.total;start+=512){
    if(a.isCancelled()) return {stopped:true};
    const n=Math.min(512,a.total-start); const _cb=a.unrankBatch?a.unrankBatch(start,n):null;
    for(let i=0;i<n;i++){ const pass=(_cb?_cb[i]:a.unrank(start+i)); const seed=C.mnemonicToSeed(a.mnemonic,pass);
      for(const pp of a.plan){ if(C.eq(C.accountNode(seed,pp.purpose,pp.account,pp.coin).c,a.targetChainCode)) return {found:pass,path:pp,index:start+i}; } }
    a.onProgress(start+n,a.total,(start+n)/((performance.now()-t0)/1000)); await new Promise(r=>setTimeout(r,0));
  }
  return {found:null};
}
// JS-CPU fallback for the ADDRESS target (adds the secp256k1 derive per candidate).
async function cpuCrackAddress(a){
  const C=window.BIP39Crypto, t0=performance.now();
  const plan=a.plan.filter(pp=>C.purposeType(pp.purpose)===a.target.type);
  const changes=(a.changes&&a.changes.length)?a.changes:[0]; const gap=Math.max(1,a.gap||1);
  for(let start=0;start<a.total;start+=128){
    if(a.isCancelled()) return {stopped:true};
    const n=Math.min(128,a.total-start); const _cb=a.unrankBatch?a.unrankBatch(start,n):null;
    for(let i=0;i<n;i++){ const pass=(_cb?_cb[i]:a.unrank(start+i)); const seed=C.mnemonicToSeed(a.mnemonic,pass);
      for(const pp of plan){ const acct=C.deriveHardenedPath(seed,[pp.purpose,pp.coin||0,pp.account||0]);
        for(const ch of changes){ const chNode=C.ckdNormal(acct,ch);
          for(let idx=0;idx<gap;idx++){ const node=C.ckdNormal(chNode,idx);
            const tg=C.pubToTarget(C.privToPub(node.k),pp.purpose);
            if(tg.type===a.target.type&&C.eq(tg.program,a.target.program)) return {found:pass,path:{...pp,change:ch,index:idx},index:start+i}; } } } }
    a.onProgress(start+n,a.total,(start+n)/((performance.now()-t0)/1000)); await new Promise(r=>setTimeout(r,0));
  }
  return {found:null};
}

// ---------- recompute ----------
function freeLive(){ liveSets.forEach(s=>{try{s.free()}catch(e){}}); liveSets=[]; }
// Flag a target (address / [xyz]pub) pasted into the mnemonic or passphrase box --
// it belongs in Target. Real BIP39 words are short lowercase; an extended key or
// address is one long base58/bech32 token, so this won't trip on normal patterns.
function looksLikeTargetPaste(text){
  const s=(text||'').trim(); if(!s) return false;
  return /(?:^|\s)[xyztuv]pub[1-9A-HJ-NP-Za-km-z]{40,}/i.test(s)   // extended pubkey
      || /(?:^|\s)bc1[02-9ac-hj-np-z]{20,}/i.test(s)               // bech32 / bech32m address
      || /(?:^|\s)[13][1-9A-HJ-NP-Za-km-z]{24,}(?:\s|$)/.test(s);  // base58 P2PKH / P2SH
}
function recompute(){
  autoResetCrack();   // editing a search input clears a finished crack result (see fn)
  freeLive();
  const target = segVal('#targetSeg','data-t');
  // The ESTIMATE uses the BEST measured rates (GPU if benchmarked, else CPU) --
  // the backend SELECTOR only chooses what the actual crack runs on.
  const backend = calGpu ? 'gpu' : 'cpu';
  $('#targetNote').textContent = target==='xpub' ? t('noteXpub') : t('noteAddr');
  const purposes = $$('#purposes input').filter(c=>c.checked).map(c=>c.dataset.p);
  // Unified UI: always pass BOTH axes; the model infers the mode from cardinality
  // (fixed mnemonic + passphrase pattern => passphrase; mnemonic pattern + blank
  // passphrase => words; both varying => joint). A blank passphrase = card-1 empty
  // string, so the common "one missing word, no passphrase" case lands on words.
  const passPat = $('#passPat').value.trim();
  const input = {
    passphrasePattern: passPat || null,
    mnemonicPattern: $('#wordsPat').value.trim() || null,
    targetType: target, backend,
    requireChecksum: $('#reqChecksum').checked,
    cores: parseInt($('#cores').value,10)||1,
    calibration: calGpu || calCpu,
    path:{ purposes: purposes.length?purposes:['bip84'],
           accounts:parseInt($('#accts').value,10)||1,
           change:parseInt($('#change').value,10)||1,
           gap:parseInt($('#gap').value,10)||1 },
    exactThreshold:50000, sampleSize:5000, exactFallbackCap:1000000,
  };
  let r;
  try{ r = BIP39Estimator.estimate(input,{rxe:RXE,validator:VALIDATOR}); }
  catch(e){ $('#results').innerHTML='<div class="card"><h3>parse error</h3><div class="err">'+esc(e.message)+'</div></div>'; $('#strategyLine').innerHTML=''; return; }
  render(r, input);
  $('#strategyLine').innerHTML = strategyText(r);
  // Wrong-box guard: an address/xpub pasted into the mnemonic or passphrase box.
  const mnBad=looksLikeTargetPaste($('#wordsPat').value), passBad=looksLikeTargetPaste($('#passPat').value);
  $('#boxWarn').innerHTML = (mnBad||passBad)
    ? '<span class="warnmsg">'+t(mnBad?'wrongBoxMn':'wrongBoxPass')+'</span>' : '';
  liveSets = [r._sets.passSet, r._sets.wordsSet].filter(Boolean);
}
// One-line "which axis are we cracking, and why" -- replaces the old mode tab as
// the transparency signal (the strategy is now inferred, not chosen).
function strategyText(r){
  const m = r.mode;
  if(m==='words')      return '🧩 '+t('stratWords');
  if(m==='passphrase') return '🔑 '+t('stratPass');
  if(m==='joint')      return '✳️ '+t('stratJoint')+' <span class="warnmsg" style="display:inline">'+t('stratJointNyi')+'</span>';
  return '';
}

// ---------- render ----------
function bigVal(b){ if(b===null||b===undefined) return '∞ '+t('unboundedShort'); const s=(typeof b==='bigint'?b:BigInt(b)).toString(); return `<span title="${esc(spoken(s))}">${fmtBig(b)}</span>`; }
function render(r, input){
  lastR = r;
  let html = '';
  const crackable = (r.mode==='passphrase'||r.mode==='words');
  // Timings (prognosis + ETA) only after a benchmark; before that, sizes only.
  // The prognosis pane holds its own title and the Crack button (right-flushed),
  // so cracking is only offered once benchmarked -- which is fine.
  if(BENCH){
    const tl = tierLabel(r.tier.key);
    const timeStr = r.unbounded?t('unbounded'):(r.eta?(t('exhaustIn')+' '+localizeTime(r.eta.timeToExhaust)):'');
    html += `<div class="verdict ${r.tier.color}" style="flex-direction:column;align-items:stretch;gap:9px">
      <div style="display:flex;justify-content:space-between;align-items:center;width:100%;gap:10px">
        <span style="font-size:11px;text-transform:uppercase;letter-spacing:.08em;opacity:.82">${t('prognosis')}</span>
        ${crackable?`<button class="act" id="openCrack" style="margin:0;padding:5px 13px;font-size:13px">${t('crackOpen')}</button>`:''}
      </div>
      <div>${tl} — ${timeStr}</div>
    </div>`;
  } else {
    html += `<div class="cta"><div style="margin-bottom:8px">${t('benchGate')}</div><button class="act" id="ctaBench" style="margin-top:0">${t('benchDo')}</button></div>`;
  }

  const totalStr = r.totalCandidates===null ? null : r.totalCandidates.toString();
  html += `<div class="card"><h3>${t('totalCandidates')} <span class="pill">${t('dimPill')}</span></h3>
    <div class="big"${totalStr?` title="${esc(spoken(totalStr))}"`:''}>${r.unbounded?t('unboundedShort'):fmtBig(r.totalCandidates)}</div>`;
  const kv=[];
  if(r.passphrase) kv.push([t('kPassSet'), r.passphrase.infinite?('∞ '+t('unboundedShort')):bigVal(r.passphrase.cardinality)]);
  if(r.mnemonic&&r.mnemonic.survival){
    const s=r.mnemonic.survival;
    if(s.infinite) kv.push([t('kMnemRaw'),'∞ '+t('unboundedShort')]);
    else{
      kv.push([t('kMnemRaw'),bigVal(s.raw)]);
      kv.push([`${t('kChecksum')} (${s.method})`, bigVal(s.validCount)+`  (${(s.fraction*100).toPrecision(3)}%)`]);
    }
  }
  if(r.mode==='joint'&&!r.unbounded) kv.push([t('kDim1'), bigVal(r.dim1)]);
  kv.push([t('kPathMult'), '×'+r.pathPlan.value+(r.pathPlan.collapsed?' ('+t('collapsed')+')':'')]);
  html += '<div class="kv">'+kv.map(([k,val])=>`<div class="k">${k}</div><div class="v">${val}</div>`).join('')+'</div></div>';

  if(r.eta && BENCH){
    html += `<div class="card"><h3>${t('etaTitle')} <span class="pill">${r.eta.calibrated?t('etaCalibrated'):t('etaAssumed')}</span></h3>
      <div class="kv">
        <div class="k">${t('etaExhaust')}</div><div class="v">${localizeTime(r.eta.timeToExhaust)}</div>
        <div class="k">${t('etaHit')}</div><div class="v">${localizeTime(r.eta.expectedTimeToHit)}</div>
        ${r.eta.rawSweep ? `<div class="k">${t('etaSweep')}</div><div class="v">${fmtBig(r.eta.rawSweep)} → ${localizeTime(r.eta.sweepTime)}</div>
        <div class="k">${t('etaKdf')}</div><div class="v">${fmtBig(Math.round(Number(r.dim1)))} → ${localizeTime(r.eta.seedTime)}</div>` : ''}
        <div class="k">${t('etaRate')}</div><div class="v">${fmtBig(Math.round(r.eta.kdfRate))}/s KDF${input.backend==='cpu'?' ('+input.cores+' '+t('cores')+')':''}</div>
      </div>
      <div class="note">${esc(r.eta.note)} ${esc(r.eta.rateSource)}.</div></div>`;
  }

  if(r.warnings.length) html+=`<div class="card">${r.warnings.map(w=>`<div class="warnmsg">⚠ ${esc(w)}</div>`).join('')}</div>`;
  if(r.notes.length) html+=`<div class="card"><h3>${t('notes')}</h3>${r.notes.map(n=>`<div class="note">• ${esc(n)}</div>`).join('')}</div>`;
  if(r.narrowingLevers.length)
    html+=`<div class="card"><h3>${t('levers')}</h3><ul class="levers">${r.narrowingLevers.map(l=>`<li>${esc(l)}</li>`).join('')}</ul></div>`;

  html+=`<div class="card"><button class="ghost" id="showSample">🎲 ${t('showDryRun')}</button></div>`;
  $('#results').innerHTML=html;
  const cb=$('#ctaBench'); if(cb) cb.onclick=openBenchModal;
  const ss=$('#showSample'); if(ss) ss.onclick=openSampleModal;
  const oc=$('#openCrack'); if(oc) oc.onclick=openCrackModal;
}
function openCrackModal(){ $('#crackSummary').innerHTML = lastR ? strategyText(lastR) : ''; $('#crackOverlay').classList.add('on'); }
function openSampleModal(){
  if(!lastR) return;
  $('#sampleBody').innerHTML = sampleHTML(lastR);
  $('#sampleOverlay').classList.add('on');
}

function sampleHTML(r){
  const mode=r.mode;
  const set = (mode==='words')?r._sets.wordsSet : r._sets.passSet || r._sets.wordsSet;
  if(!set) return '<div class="note">'+t('nothingSample')+'</div>';
  if(set.isInfinite()) return '<div class="note">'+t('sampleUnbounded')+'</div>';
  const N=set.cardinality(); if(N===null) return '<div class="note">'+t('unboundedShort')+'.</div>';
  const showWords = (mode==='words'||mode==='joint');
  const n=6; const out=[];
  const cap = N<BigInt(n)?Number(N):n;
  out.push('<div class="note">'+t('firstN')+' '+cap+':</div>');
  for(let i=0;i<cap;i++){ out.push(line(set,BigInt(i),showWords)); }
  if(N>BigInt(n)){
    out.push('<div class="note" style="margin-top:6px">'+t('randomN')+' '+n+':</div>');
    for(let k=0;k<n;k++){ const i=BigInt(Math.floor(Math.random()*Number(N))); out.push(line(set,i,showWords)); }
  }
  if(mode==='joint') out.push('<div class="note" style="margin-top:6px">'+t('jointSample')+'</div>');
  return out.join('');
}
function line(set,i,checkValid){
  let s=set.unrank(i); if(s===null) return '';
  const bad = checkValid && !VALIDATOR.isValid(s);
  const disp = checkValid ? s.trim().replace(/\s+/g,' ') : s;
  return `<code class="${bad?'bad':''}"><span class="ix">#${i}</span> ${esc(disp)}${checkValid?(bad?' ✗':' ✓'):''}</code>`;
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

// ---------- dictionaries ----------
function addDict(){
  const name=$('#dName').value.trim();
  if(!/^[A-Za-z0-9_-]+$/.test(name)){ alert('name must be letters/digits/dash'); return; }
  const words=$('#dWords').value.split(/\r?\n/).map(w=>w.trim()).filter(Boolean);
  if(!words.length){ alert('add at least one word'); return; }
  try{ RXE.registerDict(name,words); registered.set(name,words.length); renderDictList(); }
  catch(e){ alert('register failed: '+e.message); }
}
function renderDictList(){
  const host=$('#dictList'); if(!host) return; host.innerHTML='<h2 style="margin-top:18px">'+t('dictRegistered')+'</h2>';
  for(const [n,c] of registered){
    const d=document.createElement('div'); d.className='d';
    d.innerHTML=`<span>[:${esc(n)}:]</span><span class="muted">${c} ${t('dictWordsN')}</span>`;
    host.appendChild(d);
  }
}
